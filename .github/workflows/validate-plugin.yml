name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

      - name: Check manifests
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          MANIFESTS = ['plugin.json', '.claude-plugin/plugin.json', '.codex-plugin/plugin.json']
          failed = False
          versions = {}

          for path in MANIFESTS:
              with open(path) as fh:
                  data = json.load(fh)
              versions[path] = data.get('version')
              for key, value in data.items():
                  if not isinstance(value, str):
                      continue
                  if not ('/' in value or value.endswith('.json')):
                      continue
                  if value.startswith(('./', 'http://', 'https://')):
                      continue
                  print(f"::error file={path}::'{key}' is '{value}' - "
                        f"relative paths must start with ./")
                  failed = True

          if len(set(versions.values())) > 1:
              print(f"::error::manifest versions disagree: {versions}")
              failed = True
          else:
              print(f"version: {next(iter(versions.values()))}")

          with open('plugin.json') as fh:
              portable = json.load(fh)
          with open('.codex-plugin/plugin.json') as fh:
              codex = json.load(fh)
          interface = portable['extensions']['com.openai']['interface']
          assert interface == codex['interface'], 'OpenAI listing metadata differs'
          assert 1 <= len(interface['shortDescription']) <= 30, 'Subtitle exceeds 30 characters'
          assert interface['supportURL'] == 'https://support.cloudscope.io/'
          assert not {'skills', 'mcpServers', 'apps', 'interface'} & portable.keys()
          assert 'apps' not in portable['extensions']['com.openai'] and 'apps' not in codex
          review = portable['extensions']['com.openai']['review']
          assert review.keys() <= {'test_cases', 'demo_recording_url', 'commerce', 'commerce_description'}
          cases = review['test_cases']
          assert set(cases) == {'positive', 'negative'}
          for kind, count in (('positive', 5), ('negative', 3)):
              assert isinstance(cases[kind], list) and len(cases[kind]) == count
              fields = {'description', 'prompt'}
              if kind == 'positive':
                  fields |= {'tools_triggered', 'expected_behavior'}
              for case in cases[kind]:
                  assert set(case) == fields
                  assert all(isinstance(value, str) and value.strip() for value in case.values())
                  assert len(case['description']) <= 4000
          assert len({case['prompt'] for group in cases.values() for case in group}) == 8
          with open('mcp.json') as fh:
              mcp = json.load(fh)
          assert mcp == {
              '$schema': 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json',
              'mcpServers': {'covercount': {
                  'type': 'streamable-http', 'url': 'https://mcp.covercount.io/mcp'}}}

          with open('distribution.json') as fh:
              distributions = json.load(fh)
          assert set(distributions) == {'openai', 'openaiNewListing'}
          distribution = distributions['openai']
          # Registered name confirmed by the existing listing's upload error on 2026-10-01.
          assert distribution['packageName'] == 'app-6aaac50b4e908191bd7d24e896d729bf'
          skills = {path.name for path in Path('skills').iterdir() if path.is_dir()}
          assert distributions['openaiNewListing'] == {
              'packageName': 'covercount-staff', 'skillNames': {}}
          assert len({item['packageName'] for item in distributions.values()}) == 2
          for distribution in distributions.values():
              aliases = distribution['skillNames']
              assert aliases.keys() <= skills, 'Unknown export skill name'
              exported = {aliases.get(name, name) for name in skills}
              assert len(exported) == len(skills), 'Duplicate export skill names'
              assert all(len(distribution['packageName'] + ':' + name) <= 64 for name in exported)

          sys.exit(1 if failed else 0)
          PY
